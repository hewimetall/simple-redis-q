[project]
name = "simple-q-runtime"
version = "0.1.1"
description = "Queue runtime for Python async tasks, with a Rust extension for Redis enqueue and locks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["prometheus_client>=0.21"]

[project.urls]
Homepage = "https://github.com/hewimetall/simple-redis-q"
Repository = "https://github.com/hewimetall/simple-redis-q"
Issues = "https://github.com/hewimetall/simple-redis-q/issues"

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.16.0",
    "opentelemetry-sdk>=1.27",
]

[tool.maturin]
manifest-path = "crates/simple-q-runtime/Cargo.toml"
features = ["extension-module"]
python-source = "python"
python-packages = ["simple_q"]
module-name = "simple_q_runtime"

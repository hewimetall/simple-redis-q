id = "0002-layers-are-modules"
workspace_id = "sidecar"
title = "Keep the three sides as modules"
status = "proposed"
decided_at = "2026-11-10"
scope_element_id = "simple-q"
context = '''
The worker and the importable module already share one library. Splitting business logic, Redis, and the Python adapter into more crates would rename the same modules and add a wheel boundary.'''
decision = '''
simple-q-runtime stays one crate. job.decide buries a poison delivery before Python runs. Retry and timeout stay in Python, because they need the exception. The lock-key template stays in Python and is filled from kwargs at dispatch. redis_api, lock, cleanup, and slots are the server side. A second crate is not required. The test the_message_module_does_not_open_redis fails if job.rs imports redis, pyo3, tokio, or apalis.'''
consequences = '''
A handler that holds the GIL is not entered again once the delivery count passes max_deliveries. The next child calls on_dead with reason poison and leaves the message dead. A new I/O import in job.rs fails the unit test. The JSON seam in the Python bridge stays. The long-form decision remains docs/adr/0001-minimal-rust-runtime-instead-of-dramatiq.md.'''
path = "docs/adr/0002-layers-are-modules.toml"

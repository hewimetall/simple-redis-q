id = "0002-layers-are-modules"
workspace_id = "sidecar"
title = "Keep the three sides as modules"
status = "proposed"
decided_at = "2026-11-10"
scope_element_id = "simple-q"
context = '''
The worker and the importable module already share one library. Splitting business logic, Redis, and the Python adapter into more crates would rename the same modules and add a wheel boundary.'''
decision = '''
simple-q-runtime stays one crate. job, names, and ping do not open Redis or call Python. redis_api, lock, cleanup, and slots are the server side. The python module and the agent-worker binary are the user side and depend inward. The map is docs/model.toml.'''
consequences = '''
A new I/O dependency in job, names, or ping is a layering mistake. The JSON seam in the Python bridge stays until a native argument list replaces it. The long-form decision remains docs/adr/0001-minimal-rust-runtime-instead-of-dramatiq.md.'''
path = "docs/adr/0002-layers-are-modules.toml"

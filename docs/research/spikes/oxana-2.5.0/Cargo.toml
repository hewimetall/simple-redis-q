[package]
name = "spike-oxana-opaque"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
oxana = { version = "=2.5.0", default-features = false, features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
thiserror = "2"

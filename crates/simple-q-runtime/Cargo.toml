[package]
name = "simple-q-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared queue, lock, and message runtime for producers and workers"
publish = false

[lib]
name = "simple_q_runtime"
crate-type = ["cdylib", "rlib"]

[features]
# maturin enables this feature. The agent-worker binary does not, so it links libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
anyhow = "1.0.104"
apalis = { version = "1.1.1", features = ["task-context"] }
apalis-redis = { version = "1.1.1", features = ["task-tracking"] }
pyo3 = "0.30.1"
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
redis = { version = "1.8.1", features = ["aio", "tokio-comp", "script", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1.29.2", features = ["v4"] }

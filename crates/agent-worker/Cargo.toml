[package]
name = "agent-worker"
version = "0.1.1"
edition = "2024"
publish = false

[[bin]]
name = "agent-worker"
path = "src/main.rs"

[dependencies]
actix-web = "4.19.0"
anyhow = "1.0.104"
apalis = { version = "1.0.0", features = ["task-context"] }
apalis-board = { version = "1.0.0", features = ["actix", "ui"] }
apalis-redis = { version = "1.0.0", features = ["task-tracking"] }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
pyo3 = "0.30.1"
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime", "attributes"] }
serde_json = "1.0.154"
simple-q-runtime = { path = "../simple-q-runtime" }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

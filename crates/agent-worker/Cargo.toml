[package]
name = "agent-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "agent-worker"
path = "src/main.rs"

[features]
# The queue test needs Redis. `cargo test --workspace` does not enable this.
parent-exit-redis = []

[dependencies]
actix-web = "4.19.0"
anyhow = "1.0.104"
apalis = { version = "1.1.1", features = ["task-context"] }
apalis-board = { version = "1.0.0", features = ["actix", "ui"] }
apalis-redis = { version = "1.1.1", features = ["task-tracking"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.191"
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["trace"] }
pyo3 = "0.30.1"
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime", "attributes"] }
pythonize = "0.30"
redis = { version = "1.8.1", features = ["aio", "tokio-comp", "connection-manager"] }
rustix = { version = "1.0", default-features = false, features = ["std", "process"] }
serde_json = "1.0.154"
simple-q-runtime = { path = "../simple-q-runtime" }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[test]]
name = "parent_exit_queue"
path = "tests/parent_exit_queue.rs"
required-features = ["parent-exit-redis"]

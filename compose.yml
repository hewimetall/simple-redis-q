services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    image: agent-worker:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - worker
      - --app
      - simple_q.app:app
      - --queues
      - default
      - --processes
      - "1"
      - --concurrency
      - "2"
      - --max-tasks-per-process
      - "20"
    environment:
      REDIS_URL: redis://redis:6379/0
      RUST_LOG: info
      RUST_BACKTRACE: "1"
    depends_on:
      redis:
        condition: service_healthy
    init: true
    stop_grace_period: 5m

  admin:
    image: agent-worker:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["admin"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      QUEUE: default
      BOARD_ADDR: "0.0.0.0:8080"
      BOARD_TOKEN: ${BOARD_TOKEN:?set BOARD_TOKEN to at least 16 letters or digits before starting the board}
      RUST_LOG: info
      RUST_BACKTRACE: "1"
    depends_on:
      redis:
        condition: service_healthy
    init: true
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  redis-data:
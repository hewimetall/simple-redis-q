services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      RUST_LOG: info
      RUST_BACKTRACE: "1"
      BOARD_ADDR: "0.0.0.0:8080"
    depends_on:
      redis:
        condition: service_healthy
    init: true
    stop_grace_period: 5m
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  redis-data:
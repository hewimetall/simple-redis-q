[package]
name = "agent-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.19.0"
anyhow = "1.0.104"
apalis = { version = "1.0.0", features = ["task-context"] }
apalis-board = { version = "1.0.0", features = ["actix","ui"] }
apalis-redis = { version = "1.0.0", features = ["task-tracking"] }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
pyo3 = "0.30.1"
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime", "attributes"] }
pyo3-stub-gen = "0.23.2"
redis = { version = "1.8.1", features = ["aio", "tokio-comp", "script", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

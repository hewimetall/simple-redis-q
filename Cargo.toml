[workspace]
resolver = "2"
members = [
    "crates/simple-q-runtime",
    "crates/agent-worker",
    "crates/runtime",
    "crates/supervisor",
    "crates/backend",
    "crates/python-bridge",
    "crates/cli",
]
exclude = [
    "docs/research/spikes/watchexec-6.0.0",
    "docs/research/spikes/oxana-2.5.0",
    "docs/research/example/simple-q-core",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

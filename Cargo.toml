[package]
name = "agent-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.19.0"
anyhow = "1.0.104"
apalis = "1.0.0"
apalis-board = { version = "1.0.0", features = ["actix"] }
apalis-redis = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }
pyo3 = "0.30.1"
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime", "attributes"] }
pyo3-stub-gen = "0.23.2"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

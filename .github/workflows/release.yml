name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    name: Build Linux wheels
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
            docker: linux/amd64
          - runner: ubuntu-24.04-arm
            target: aarch64
            docker: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.12
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto

      - name: Build the worker wheel
        run: bash scripts/build-worker-wheel.sh ${{ matrix.platform.docker }}

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux
      - sdist
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - linux
      - sdist
    environment:
      name: pypi
      url: https://pypi.org/p/simple-q-runtime
    permissions:
      contents: read
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Split the two distributions
        run: |
          mkdir -p runtime worker
          find dist -type f \( -name 'simple_q_runtime-*' -o -name 'simple-q-runtime-*' \) -exec mv {} runtime/ \;
          find dist -type f \( -name 'simple_q_worker-*' -o -name 'simple-q-worker-*' \) -exec mv {} worker/ \;
          test -n "$(find runtime -type f -print -quit)"
          test -n "$(find worker -type f -print -quit)"

      - name: Publish simple-q-runtime with Trusted Publishing
        if: ${{ env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: runtime
          skip-existing: true

      - name: Publish simple-q-worker with Trusted Publishing
        if: ${{ env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: worker
          skip-existing: true

      - name: Publish simple-q-runtime with API token fallback
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: runtime
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish simple-q-worker with API token fallback
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: worker
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  smoke:
    name: Smoke published packages
    runs-on: ubuntu-latest
    needs:
      - pypi
    container: python:3.12-slim
    steps:
      - name: Install the tag version and import it
        run: |
          version="${GITHUB_REF_NAME#v}"
          pip install "simple-q-runtime==${version}" "simple-q-worker==${version}"
          agent-worker --version
          python -c 'import simple_q'

name: CI

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-lint-py3.12

      - name: Format
        run: cargo fmt --all -- --check

      # One x86_64 job. rustfmt on the aarch64 wheel image collides with the
      # cargo-fmt proxy, and these checks do not depend on the Python minor.
      # extension-module is the wheel link. parent-exit-redis compiles the
      # Redis queue test. The default workspace build is what the binary links.
      - name: Clippy
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p simple-q-runtime --all-targets --locked --features extension-module -- -D warnings
          cargo clippy -p agent-worker --all-targets --locked --features parent-exit-redis -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          # The venv path is the same string on every Python version. A shared
          # cache then relinks agent-worker to whichever libpython was saved.
          key: py${{ matrix.python }}

      - name: Unit tests
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pyright==1.1.414 "prometheus_client>=0.26" "maturin>=1.16,<2"
          maturin develop
          python -m pytest python/tests/test_runtime_contract.py python/tests/test_lock_release.py python/tests/test_version_source.py python/tests/test_alter_option.py python/tests/test_middleware_stack.py python/tests/test_worker_launch.py python/tests/test_interfaces.py python/tests/test_typecheck.py python/tests/test_tracking.py python/tests/test_tracing_defaults.py python/tests/test_lazy_exports.py python/tests/test_admin_kwargs.py python/tests/test_dispatch_edges.py python/tests/test_memory_edges.py python/tests/test_exposition_server.py python/tests/test_multiproc_edges.py python/tests/test_slot_identity.py -q --cov=simple_q --cov-report=term-missing --cov-fail-under=100
          cargo test --workspace

  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    services:
      redis7:
        image: redis:7
        ports:
          - 6379:6379
      redis8:
        image: redis:8
        ports:
          - 6380:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev redis-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: py${{ matrix.python }}

      - name: Build agent-worker
        run: cargo build -p agent-worker --release
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - name: Snapshot tests
        run: cargo test -p simple-q-runtime --test admin --test poll_interval -- --test-threads=1
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - name: Install the runtime extension
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pytest "prometheus_client>=0.26" "maturin>=1.16,<2"
          export PYO3_PYTHON="$(command -v python)"
          maturin develop --release -m crates/simple-q-runtime/Cargo.toml

      - name: Orphan-window tests
        run: |
          . .venv/bin/activate
          python -m pytest python/tests/test_orphan_integration.py python/tests/test_worker_info.py python/tests/test_queue_admin.py -q
        env:
          AGENT_WORKER_BIN: target/release/agent-worker
          REDIS_URL: redis://127.0.0.1:6379/15
          REDIS_URL_8: redis://127.0.0.1:6380/15
          PYTHONPATH: python
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - name: Supervisor pidfd queue test
        run: |
          . .venv/bin/activate
          cargo test -p agent-worker --features parent-exit-redis --test parent_exit_queue -- --test-threads=1
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          REDIS_URL: redis://127.0.0.1:6379/15
          PYTHONPATH: python:python/tests

  worker-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build the runtime wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist -i /opt/python/cp312-cp312/bin/python -i /opt/python/cp313-cp313/bin/python -i /opt/python/cp314-cp314/bin/python -i /opt/python/cp315-cp315/bin/python
          manylinux: auto

      - name: Build and install the worker wheels
        run: bash scripts/build-worker-wheel.sh linux/amd64
